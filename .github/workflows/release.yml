name: Release

on:
  push:
    tags:
      - koheesio-v*
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    # Forks must not enter the release path, including main-branch pushes.
    if: github.repository == 'Nike-Inc/koheesio'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  python-artifacts:
    name: Build wheel and source distribution
    if: github.repository == 'Nike-Inc/koheesio'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Build
        run: hatch build
      - name: Upload artifacts
        if: github.repository == 'Nike-Inc/koheesio'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-artifacts-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs:
      - tests
      - python-artifacts
    if: >-
      github.repository == 'Nike-Inc/koheesio' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/koheesio-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download tested Python artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-artifacts-${{ github.sha }}
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
