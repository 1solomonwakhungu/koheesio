name: Test
run-name: Tests for ${{ github.event_name }} at ${{ github.sha }}

on:
  pull_request:
    branches:
      - main
      - release/*
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# The prefix must differ from release.yml because a called workflow inherits
# github.workflow from its caller.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install policy test dependency
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Check workflow policy
        run: python -m unittest discover -s .github/workflow-policy -p 'test_*.py' -v

  tests:
    name: Python ${{ matrix.python-version }} with PySpark ${{ matrix.pyspark-version }} on Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        pyspark-version: ['33', '34', '35', '35r', '352', '352r']
        exclude:
          - python-version: '3.10'
            pyspark-version: '352'
          - python-version: '3.10'
            pyspark-version: '352r'
          - python-version: '3.11'
            pyspark-version: '33'
          - python-version: '3.11'
            pyspark-version: '34'
          - python-version: '3.11'
            pyspark-version: '352'
          - python-version: '3.11'
            pyspark-version: '352r'
          - python-version: '3.12'
            pyspark-version: '33'
          - python-version: '3.12'
            pyspark-version: '34'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select JDK 17 for Spark
        id: spark-java
        run: |
          test -x "${JAVA_HOME_17_X64:?JDK 17 is required}/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: Install Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install
      - name: Run tests
        run: hatch test --python=${{ matrix.python-version }} -i version=pyspark${{ matrix.pyspark-version }} --verbose

  # Preserve this stable required-check name. Skipped/cancelled prerequisites fail.
  final_check:
    if: always()
    needs:
      - workflow-policy
      - tests
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every prerequisite to succeed
        env:
          POLICY_RESULT: ${{ needs.workflow-policy.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$TEST_RESULT" = success
